<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dama - Repositories</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f4f6fb;
      color: #1f2937;
    }

    main {
      width: min(720px, 92vw);
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.1);
      padding: 2rem;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 0.5rem;
    }

    p {
      margin-top: 0;
      margin-bottom: 1.5rem;
    }

    .links {
      display: grid;
      gap: 1rem;
    }

    a {
      display: block;
      text-decoration: none;
      background: #2563eb;
      color: #ffffff;
      padding: 0.9rem 1rem;
      border-radius: 10px;
      font-weight: 600;
      transition: background 0.2s ease;
    }

    a:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <main>
    <h1>Progetto Dama</h1>
    <p>Seleziona una repository per accedere alla parte grafica o al server del progetto.</p>

    <div class="links">
      <a href="https://github.com/Belo-luca/Dama-socket" target="_blank" rel="noopener noreferrer">
        Parte grafica - Dama-socket
      </a>
      <a href="https://github.com/Belo-luca/dama-socket-server" target="_blank" rel="noopener noreferrer">
        Server - dama-socket-server
      </a>
    </div>
  </main>
</body>
</html>
